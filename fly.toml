# fly.toml app configuration file generated for ai-tester-backend
app = "aitester-backend"
primary_region = "cdg"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  DATABASE_URL = "sqlite:////app/data/platform.db"
  ALLOW_PRIVATE_TARGETS = "false"
  MAX_CONCURRENT_SCANS = "2"
  AGENT_TIMEOUT_SECONDS = "300"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "2048mb"
  cpu_kind = "shared"
  cpus = 2

